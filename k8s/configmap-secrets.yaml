apiVersion: v1
kind: ConfigMap
metadata:
  name: campusiq-config
  namespace: campusiq
data:
  APP_NAME: "CampusIQ"
  APP_ENV: "production"
  DEBUG: "false"
  API_V1_PREFIX: "/api/v1"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
  FRONTEND_ORIGIN: "http://campusiq.local"
  CHROMA_MODE: "server"
  CHROMA_SERVER_HOST: "chromadb-service"
  CHROMA_SERVER_PORT: "8000"
  CHROMA_COLLECTION_NAME: "campusiq_documents"
  LLM_MODEL: "llama-3.3-70b-versatile"
  EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  RAG_TOP_K: "5"
  RAG_SIMILARITY_THRESHOLD: "0.35"
  LOG_LEVEL: "INFO"
  NEXT_PUBLIC_API_BASE_URL: "http://campusiq.local/api/v1"
---
apiVersion: v1
kind: Secret
metadata:
  name: campusiq-secrets
  namespace: campusiq
type: Opaque
stringData:
  # Replace with your actual Supabase PostgreSQL connection URI
  DATABASE_URL: "postgresql://postgres:your_password@db.your_project_ref.supabase.co:5432/postgres"
  # Replace with a generated 32-character random string
  JWT_SECRET_KEY: "campusiq_super_secure_cluster_secret_key_32_chars"
  # Replace with your Groq API key
  GROQ_API_KEY: "gsk_your_actual_groq_api_key_here"
